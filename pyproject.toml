[project]
name = "metarl-iccbf"
version = "0.1.0"
description = "Meta Reinforcement Learning for ICCBFs"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core ML/RL frameworks
    "torch>=2.6.0",
    "jax>=0.7.0",
    "jaxlib>=0.7.0",
    "numpy>=1.26.4",
    # RL libraries
    "stable-baselines3>=2.7.0",
    "sb3-contrib>=2.6.0",
    "gymnasium>=0.29.1",
    "ale-py>=0.10.2",

    "shimmy>=0.2.1",
    # Hugging Face integration
    "huggingface-hub>=1.3.0",
    "huggingface-sb3 @ git+https://github.com/huggingface/huggingface_sb3.git@main",
    "datasets>=4.0.0",
    # Physics simulation
    "mujoco>=3.3.5",
    "mujoco-py>=2.1.2.14",
    # "box2d-py>=2.3.5",
    # Optimization
    "cvxpy>=1.6.4",
    "clarabel>=0.10.0",
    "ecos>=2.0.14",
    "osqp>=1.0.3",
    "scs>=3.2.7.post2",
    "mosek>=11.0.16",
    # Experiment tracking
    "optuna>=4.4.0",
    "sacred>=0.8.7",
    "tensorboard>=2.19.0",
    "wandb>=0.16.0",
    # Utilities
    "matplotlib>=3.10.1",
    "opencv-python>=4.11.0.86",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "moviepy>=2.2.1",
    "scikit-learn>=1.7.1",
    "joblib>=1.4.2",
    "protobuf>=6.30.2",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "tqdm",
    "mamba-ssm[causal-conv1d]",
    "symengine>=0.14.1",
    "daceypy>=1.3.0",
    "mo-gymnasium>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
envs = [
    "pygame>=2.6.1",
    "box2d-py>=2.3.5",
]

[project.scripts]
metarl-train = "metarl_iccbf.cruise_control.training.cli:main"
metarl-train-inspection = "metarl_iccbf.inspection.training.cli:main"
metarl-eval-inspection = "metarl_iccbf.inspection.evaluation.cli:main"
metarl-train-docking = "metarl_iccbf.docking.training.train:main"
metarl-eval-docking = "metarl_iccbf.docking.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/metarl_iccbf"]

[tool.uv]
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"
